spring:
  application:
    name: jeongminkim_backend

  datasource:
    url: jdbc:mysql://localhost:3306/transfer_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: transfer_user
    password: transfer_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true
