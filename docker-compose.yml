version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: transfer-db
    environment:
      MYSQL_DATABASE: transfer_db
      MYSQL_USER: transfer_user
      MYSQL_PASSWORD: transfer_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "transfer_user", "-ptransfer_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
